# Despliegue del mensajero: dos nodos en una red bridge definida por el usuario.
# Arranque:  docker compose up --build
#
# Cada nodo se encuentra con el otro por su NOMBRE DE SERVICIO (nodo-a, nodo-b):
# el DNS interno de Docker lo traduce a la IP del contenedor. No hay IP en el código.

name: mensajero

services:
  nodo-a:
    build: ./servidor
    image: mensajero-nodo:1.0
    hostname: nodo-a
    environment:
      NODO_NOMBRE: nodo-a
      PAR_URL: ws://nodo-b:8080/nodo     # se conecta al otro nodo por nombre
    ports:
      - "8081:8080"                      # anfitrión:8081 -> contenedor:8080
    networks:
      - mensajero-red
    restart: unless-stopped

  nodo-b:
    build: ./servidor
    image: mensajero-nodo:1.0
    hostname: nodo-b
    environment:
      NODO_NOMBRE: nodo-b
      PAR_URL: ws://nodo-a:8080/nodo
    ports:
      - "8082:8080"                      # anfitrión:8082 -> contenedor:8080
    networks:
      - mensajero-red
    restart: unless-stopped

networks:
  mensajero-red:
    name: mensajero-red
    driver: bridge
